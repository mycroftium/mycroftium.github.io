<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles | Mai Zhang</title>
    <link rel="icon" type="image/png" href="stamp.png">

    <!-- Google Fonts: Cabin -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Base styles */
        html {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Corbel', 'Cabin', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #000000;
            
            /* DESKTOP: The Golden Ratio applied horizontally */
            display: grid;
            grid-template-columns: 38.2vw 61.8vw; 
        }

        /* Anti-download base rules */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Top Left Header */
        .top-header {
            position: fixed;
            top: 50px;
            left: 22vw;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            text-decoration: none;
            color: #000000;
        }

        .logo-img {
            width: 45px;
            height: auto;
        }

        .site-title {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Fixed Left Navigation */
        .side-nav {
            grid-column: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; 
            padding-left: 22vw;
            gap: 40px;
            height: 100%;
        }

        .side-nav a {
            text-decoration: none;
            color: #000000;
            font-size: 1.2rem; 
            transition: color 0.3s ease;
        }

        .side-nav a:hover {
            color: #888888; 
        }

        .side-nav a.active {
            font-weight: bold;
            text-decoration: underline;
        }

        /* Right Column (Articles Content) */
        .center-content {
            grid-column: 2; 
            display: flex;
            justify-content: center; 
            align-items: center;
            height: 100%;
            position: relative;
        }

        /* Articles List Styling */
        .articles-container {
            display: flex;
            flex-direction: column;
            gap: 50px; /* Space between articles */
            width: 80%;
            max-width: 600px;
        }

        .article-title {
            text-decoration: none;
            color: #000000;
            font-size: 1.6rem;
            line-height: 1.4;
            transition: color 0.3s ease;
            display: block;
        }

        .article-title:hover {
            color: #888888;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body {
                /* MOBILE: The Golden Ratio applied vertically */
                display: grid;
                grid-template-columns: 100vw;
                grid-template-rows: 38.2vh 61.8vh; 
                height: 100vh;
                overflow: hidden; 
            }
            .top-header { 
                position: absolute; 
                left: 20px; 
                top: 20px; 
            }
            .side-nav { 
                grid-row: 1; 
                padding-left: 0;
                margin: 0;
                width: 100%;
                height: 100%;
                flex-direction: column; 
                justify-content: flex-end; 
                align-items: center; 
                gap: 12px; 
                padding-bottom: 20px; 
            }
            .side-nav a {
                font-size: 1.1rem; 
            }
            .center-content { 
                grid-row: 2; 
                height: 100%;
                width: 100%;
                padding: 0;
                align-items: flex-start; /* Push articles to the top of the section on mobile */
                padding-top: 30px; 
            }
            .articles-container {
                width: 85%;
                gap: 40px;
                text-align: center; /* Centers the article text for mobile aesthetics */
            }
            .article-title {
                font-size: 1.3rem; /* Slightly smaller for phone screens */
            }
        }
    </style>
</head>
<body>

    <!-- Top Left Header linked to maizhang.net -->
    <a href="https://maizhang.net" class="top-header" aria-label="Mai Zhang Home">
        <img src="stamp.png" alt="Mai Zhang Seal" class="logo-img" oncontextmenu="return false;">
        <span class="site-title">Mai Zhang</span>
    </a>

    <!-- Navigation Links -->
    <nav class="side-nav">
        <a href="index.html">Pictures</a>
        <a href="portrait.html">Portrait</a>
        <!-- Articles marked as active -->
        <a href="articles.html" class="active">Articles</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Center Content: Articles List -->
    <main class="center-content">
        <div class="articles-container">
            <!-- Article 1 -->
            <a href="article-landing.html" class="article-title">Landing: Fishermen who can't fish anymore</a>
            
            <!-- Article 2 -->
            <a href="article-famous.html" class="article-title">Young and famous: Jessica's triple life</a>
        </div>
    </main>

</body>
</html>
