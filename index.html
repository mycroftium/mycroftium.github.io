<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai Zhang</title>
    <style>
        /* Base styles and Golden Ratio Grid */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Corbel', sans-serif;
            background-color: #ffffff;
            color: #000000;
            
            /* The Golden Ratio: 38.2% left column, 61.8% right column */
            display: grid;
            grid-template-columns: 38.2vw 61.8vw; 
        }

        /* Top Left Header (Logo and Name) */
        .top-header {
            position: fixed;
            top: 50px;
            left: 10%; /* Sits nicely inside the left column */
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .logo-img {
            width: 45px; /* Adjust this to match your red stamp size */
            height: auto;
        }

        .site-title {
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Left Column (Navigation) */
        .side-nav {
            grid-column: 1; /* Places this in the smaller 38.2% column */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Vertically centers the menu */
            align-items: center;     /* Horizontally centers within its column */
            gap: 40px;
            height: 100%;
        }

        .side-nav a {
            text-decoration: none;
            color: #000000;
            font-size: 1.1rem;
            font-weight: 300;
            transition: color 0.3s ease;
        }

        .side-nav a:hover {
            color: #888888; /* Fades to grey when you hover over the links */
        }

        /* Right Column (Calligraphy Content) */
        .center-content {
            grid-column: 2; /* Places this in the larger 61.8% column */
            display: flex;
            justify-content: center; /* Centers the image inside the 61.8% space */
            align-items: center;
            height: 100%;
        }

        .hero-img {
            max-width: 350px; /* Adjust this to match your calligraphy size */
            height: auto;
        }
        
        /* Mobile Responsiveness (Stacks vertically on small screens) */
        @media (max-width: 768px) {
            body {
                display: flex;
                flex-direction: column;
            }
            .top-header { 
                left: 20px; 
                top: 20px; 
            }
            .side-nav {
                height: auto;
                margin-top: 150px;
                margin-bottom: 50px;
            }
            .center-content {
                height: auto;
            }
            .hero-img { 
                max-width: 200px; 
            }
        }
    </style>
</head>
<body>

    <!-- Top Left Header -->
    <header class="top-header">
        <!-- Make sure the filename matches your uploaded red stamp image -->
        <img src="stamp.png" alt="Mai Zhang Seal" class="logo-img">
        <span class="site-title">Mai Zhang</span>
    </header>

    <!-- Navigation Links (Left Column) -->
    <nav class="side-nav">
        <a href="#pictures">Pictures</a>
        <a href="#portrait">Portrait</a>
        <a href="#articles">Articles</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Center Calligraphy (Right Column) -->
    <main class="center-content">
        <!-- Make sure the filename matches your uploaded calligraphy image -->
        <img src="calligraphy.png" alt="Mai Zhang Calligraphy" class="hero-img">
    </main>

</body>
</html>
