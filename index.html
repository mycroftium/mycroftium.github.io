<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai Zhang</title>
    <style>
        /* Import a clean, minimalist web font */
        @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap');

        /* Base styles */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Jost', sans-serif;
            background-color: #ffffff;
            color: #000000;
        }

        /* Top Left Header (Logo and Name) */
        .top-header {
            position: fixed;
            top: 50px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .logo-img {
            width: 45px; /* Adjust this to match your red stamp size */
            height: auto;
        }

        .site-title {
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Left Side Navigation Menu */
        .side-nav {
            position: fixed;
            top: 50%;
            left: 60px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 40px;
            z-index: 10;
        }

        .side-nav a {
            text-decoration: none;
            color: #000000;
            font-size: 1.1rem;
            font-weight: 300;
            transition: color 0.3s ease;
        }

        .side-nav a:hover {
            color: #888888; /* Fades to grey when you hover over the links */
        }

        /* Center Content (Calligraphy) */
        .center-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .hero-img {
            max-width: 350px; /* Adjust this to match your calligraphy size */
            height: auto;
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .top-header { left: 20px; top: 20px; }
            .side-nav { left: 20px; gap: 25px; }
            .hero-img { max-width: 200px; }
        }
    </style>
</head>
<body>

    <!-- Top Left Header -->
    <header class="top-header">
        <!-- REPLACE 'stamp.png' with the actual filename of your red logo -->
        <img src="stamp.png" alt="Mai Zhang Seal" class="logo-img">
        <span class="site-title">Mai Zhang</span>
    </header>

    <!-- Navigation Links -->
    <nav class="side-nav">
        <a href="#pictures">Pictures</a>
        <a href="#portrait">Portrait</a>
        <a href="#articles">Articles</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Center Calligraphy -->
    <main class="center-content">
        <!-- REPLACE 'calligraphy.png' with the actual filename of your center image -->
        <img src="calligraphy.png" alt="Mai Zhang Calligraphy" class="hero-img">
    </main>

</body>
</html>
