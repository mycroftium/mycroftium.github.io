<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai Zhang</title>
    <style>
        /* Base styles and Golden Ratio Grid */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Corbel', sans-serif;
            background-color: #ffffff;
            color: #000000;
            
            /* The Golden Ratio: 38.2% left column, 61.8% right column */
            display: grid;
            grid-template-columns: 38.2vw 61.8vw; 
        }

        /* Top Left Header (Logo and Name) */
        .top-header {
            position: fixed;
            top: 50px;
            left: 12vw; /* Locks the header to the exact same vertical line as the menu */
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .logo-img {
            width: 45px;
            height: auto;
        }

        .site-title {
            font-size: 1.8rem; /* Increased size to look elegant with Corbel */
            font-weight: normal; 
            letter-spacing: 0.5px;
        }

        /* Left Column (Navigation) */
        .side-nav {
            grid-column: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; /* Aligns the text strictly to the left */
            padding-left: 12vw; /* Matches the 'left' value of the header perfectly */
            gap: 40px;
            height: 100%;
        }

        .side-nav a {
            text-decoration: none;
            color: #000000;
            font-size: 1.2rem; /* Slightly larger links */
            transition: color 0.3s ease;
        }

        .side-nav a:hover {
            color: #888888; 
        }

        /* Right Column (Calligraphy Content) */
        .center-content {
            grid-column: 2; 
            display: flex;
            justify-content: center; 
            align-items: center;
            height: 100%;
        }

        .hero-img {
            max-width: 350px; 
            height: auto;
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body {
                display: flex;
                flex-direction: column;
            }
            .top-header { 
                left: 20px; 
                top: 20px; 
            }
            .side-nav {
                padding-left: 20px;
                height: auto;
                margin-top: 150px;
                margin-bottom: 50px;
            }
            .center-content {
                height: auto;
            }
            .hero-img { 
                max-width: 200px; 
            }
        }
    </style>
</head>
<body>

    <!-- Top Left Header -->
    <header class="top-header">
        <img src="stamp.png" alt="Mai Zhang Seal" class="logo-img">
        <span class="site-title">Mai Zhang</span>
    </header>

    <!-- Navigation Links -->
    <nav class="side-nav">
        <a href="#pictures">Pictures</a>
        <a href="#portrait">Portrait</a>
        <a href="#articles">Articles</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Center Calligraphy -->
    <main class="center-content">
        <img src="calligraphy.png" alt="Mai Zhang Calligraphy" class="hero-img">
    </main>

</body>
</html>
