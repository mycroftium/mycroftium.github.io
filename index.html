<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictures | Mai Zhang</title>
    <link rel="icon" type="image/png" href="stamp.png">

    <!-- Google Fonts: Cabin -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Base styles and Golden Ratio Grid */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Corbel', 'Cabin', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #000000;
            
            /* The Golden Ratio: 38.2% left column, 61.8% right column */
            display: grid;
            grid-template-columns: 38.2vw 61.8vw; 
        }

        /* Anti-download base rules */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Top Left Header (Logo and Name) */
        .top-header {
            position: fixed;
            top: 50px;
            left: 22vw;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            text-decoration: none;
            color: #000000;
        }

        .logo-img {
            width: 45px;
            height: auto;
        }

        .site-title {
            font-size: 1.8rem; 
            font-weight: 400; 
            letter-spacing: 0.5px;
        }

        /* Left Column (Navigation) */
        .side-nav {
            grid-column: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; 
            padding-left: 22vw;
            gap: 40px;
            height: 100%;
        }

        .side-nav a {
            text-decoration: none;
            color: #000000;
            font-size: 1.2rem; 
            transition: color 0.3s ease;
        }

        .side-nav a:hover {
            color: #888888; 
        }
        
        .side-nav a.active {
            font-weight: bold;
            text-decoration: underline;
        }

        /* Right Column (Calligraphy Content) */
        .center-content {
            grid-column: 2; 
            display: flex;
            justify-content: center; 
            align-items: center;
            height: 100%;
            position: relative;
        }

        /* Image Wrapper for the transparent shield */
        .image-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-img {
            max-width: 350px; 
            height: auto;
            pointer-events: none; /* Helps block right-clicks on the image itself */
        }

        .overlay-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 2;
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body {
                /* Switch from Grid to Flexbox for mobile */
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .top-header { 
                /* Keep fixed in the top left corner */
                left: 20px; 
                top: 20px; 
            }
            .side-nav { 
                /* Center the links horizontally */
                padding-left: 0;
                margin-top: 120px; /* Space below the header */
                margin-bottom: 40px;
                width: 100%;
                height: auto;
                flex-direction: row; /* Switch from vertical column to horizontal row */
                justify-content: center;
                flex-wrap: wrap;
                gap: 20px;
            }
            .side-nav a {
                font-size: 1.1rem;
            }
            .center-content { 
                /* Center the calligraphy image */
                height: auto;
                width: 100%;
                padding-bottom: 50px;
            }
            .hero-img { 
                max-width: 70vw; /* Scales beautifully on any phone size */
            }
        }
    </style>
</head>
<body>

    <!-- Top Left Header linked to maizhang.net -->
    <a href="https://maizhang.net" class="top-header" aria-label="Mai Zhang Home">
        <img src="stamp.png" alt="Mai Zhang Seal" class="logo-img" oncontextmenu="return false;">
        <span class="site-title">Mai Zhang</span>
    </a>

    <!-- Navigation Links -->
    <nav class="side-nav">
        <a href="index.html" class="active">Pictures</a>
        <a href="portrait.html">Portrait</a>
        <a href="articles.html">Articles</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Center Calligraphy -->
    <main class="center-content">
        <div class="image-wrapper">
            <img src="calligraphy.png" alt="Mai Zhang Calligraphy" class="hero-img">
            <div class="overlay-shield"></div>
        </div>
    </main>

    <!-- Script to disable right-click menu on the calligraphy image -->
    <script>
        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'IMG' || e.target.closest('.image-wrapper')) {
                e.preventDefault();
            }
        }, false);
    </script>

</body>
</html>
