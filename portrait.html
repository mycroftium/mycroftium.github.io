<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portrait | Mai Zhang</title>
    <link rel="icon" type="image/png" href="stamp.png">

    <!-- Google Fonts: Cabin -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Base styles */
        html {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Corbel', 'Cabin', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #000000;
        }

        /* Anti-download base rules */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Fixed Left Header */
        .top-header {
            position: fixed;
            top: 50px;
            left: 10vw;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            text-decoration: none;
            color: #000000;
        }

        .logo-img {
            width: 45px;
            height: auto;
        }

        .site-title {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Fixed Left Navigation */
        .side-nav {
            position: fixed;
            top: 50%;
            left: 10vw;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 40px;
            z-index: 10;
        }

        .side-nav a {
            text-decoration: none;
            color: #000000;
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .side-nav a:hover {
            color: #888888;
        }

        .side-nav a.active {
            font-weight: bold;
            text-decoration: underline;
        }

        /* Center Content Area */
        .center-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        /* Slider Container */
        .slider-container {
            width: 61.8vw;
            height: 90vh; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* Hide slides by default */
        .slide {
            display: none;
            width: 100%;
            height: 100%;
        }

        /* Image Wrapper */
        .image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ensure images scale correctly */
        .hero-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; 
            display: block;
            pointer-events: none;
        }

        .overlay-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 2;
        }

        /* Clean arrows */
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #000000;
            font-weight: normal;
            font-size: 2.5rem;
            background-color: transparent;
            border: none;
            z-index: 5;
            transition: color 0.3s ease;
            padding: 10px;
        }

        .prev { left: 0; }
        .next { right: 0; }
        
        .prev:hover, .next:hover {
            color: #888888;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body {
                display: flex;
                flex-direction: column;
                justify-content: center; /* Centers everything vertically */
                align-items: center; /* Centers everything horizontally */
                height: 100vh; /* Locks screen height to prevent scrolling */
                overflow: hidden;
            }
            .top-header {
                position: absolute;
                left: 20px;
                top: 20px;
            }
            .side-nav {
                position: static;
                transform: none;
                padding-left: 0;
                margin-top: 70px; /* Drops links just below the absolute header */
                margin-bottom: 20px;
                width: 100%;
                height: auto;
                flex-direction: row; /* Forces links to display side-by-side horizontally */
                justify-content: center;
                gap: 15px; /* Spaces them out evenly */
            }
            .side-nav a {
                font-size: 1.05rem; /* Slight size reduction for phone screens */
            }
            .center-content {
                height: auto;
                width: 100%;
                flex: 1; /* Takes up all remaining screen space */
                max-height: calc(100vh - 140px); /* Strictly limits height so it stays on screen */
                display: flex;
                align-items: center;
                padding-bottom: 20px;
            }
            .slider-container {
                width: 95vw;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Top Left Header linked to maizhang.net -->
    <a href="https://maizhang.net" class="top-header" aria-label="Mai Zhang Home">
        <img src="stamp.png" alt="Mai Zhang Seal" class="logo-img" oncontextmenu="return false;">
        <span class="site-title">Mai Zhang</span>
    </a>

    <!-- Navigation Links -->
    <nav class="side-nav">
        <a href="index.html">Pictures</a>
        <a href="portrait.html" class="active">Portrait</a>
        <a href="articles.html">Articles</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Center Content: The Protected Slider -->
    <main class="center-content">
        <div class="slider-container" id="sliderContainer">

            <!-- Slide 1 -->
            <div class="slide">
                <div class="image-wrapper">
                    <img src="images/p1.jpeg" alt="Portrait 1" class="hero-img">
                    <div class="overlay-shield"></div>
                </div>
            </div>
            
            <!-- Slide 2 -->
            <div class="slide">
                <div class="image-wrapper">
                    <img src="images/p2.jpeg" alt="Portrait 2" class="hero-img">
                    <div class="overlay-shield"></div>
                </div>
            </div>
            
            <!-- Slide 3 -->
            <div class="slide">
                <div class="image-wrapper">
                    <img src="images/p3.jpeg" alt="Portrait 3" class="hero-img">
                    <div class="overlay-shield"></div>
                </div>
            </div>

            <!-- Slide 4 -->
            <div class="slide">
                <div class="image-wrapper">
                    <img src="images/p4.jpeg" alt="Portrait 4" class="hero-img">
                    <div class="overlay-shield"></div>
                </div>
            </div>

            <!-- Navigation Controls -->
            <button class="prev" onclick="changeSlide(-1)" aria-label="Previous Slide">&#10094;</button>
            <button class="next" onclick="changeSlide(1)" aria-label="Next Slide">&#10095;</button>
        </div>
    </main>

    <!-- Slider & Protection Logic -->
    <script>
        let currentIndex = 0;
        showSlide(currentIndex);

        function changeSlide(n) {
            showSlide(currentIndex += n);
        }

        function showSlide(n) {
            let slides = document.getElementsByClassName("slide");
            
            if (n >= slides.length) { currentIndex = 0; }
            if (n < 0) { currentIndex = slides.length - 1; }
            
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            
            slides[currentIndex].style.display = "block";
        }

        // Disable right-click across all images and the slider container
        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'IMG' || e.target.closest('.slider-container')) {
                e.preventDefault();
            }
        }, false);
    </script>

</body>
</html>
